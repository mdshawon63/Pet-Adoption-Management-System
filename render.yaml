databases:
  - name: pet-adoption-db
    plan: free
    databaseName: pet_adoption
    user: pet_adoption

services:
  - type: web
    name: pet-adoption-system
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pet-adoption-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"