{% extends "base.html" %}

{% block title %}
My Profile - PetCare
{% endblock %}


{% block content %}

<section class="section">

    <div class="container">

        <div class="profile-container">

            <div class="profile-header">

                <div class="profile-picture">

                    {% if user_profile.profile_picture %}

                        <img
                            src="{{ user_profile.profile_picture.url }}"
                            alt="Profile Picture"
                        >

                    {% else %}

                        👤

                    {% endif %}

                </div>


                <div>

                    <p class="section-small">
                        MY ACCOUNT
                    </p>

                    <h1>
                        {{ user_profile.username }}
                    </h1>

                    <p>
                        {{ user_profile.email }}
                    </p>

                </div>

            </div>


            <form
                method="POST"
                enctype="multipart/form-data"
                class="profile-form"
            >

                {% csrf_token %}


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            First Name
                        </label>

                        <input
                            type="text"
                            name="first_name"
                            value="{{ user_profile.first_name }}"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Last Name
                        </label>

                        <input
                            type="text"
                            name="last_name"
                            value="{{ user_profile.last_name }}"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        value="{{ user_profile.email }}"
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            value="{{ user_profile.phone }}"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Location
                        </label>

                        <input
                            type="text"
                            name="location"
                            value="{{ user_profile.location }}"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        name="date_of_birth"
                        value="{{ user_profile.date_of_birth|date:'Y-m-d' }}"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Profile Picture
                    </label>

                    <input
                        type="file"
                        name="profile_picture"
                        accept="image/*"
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Update Profile
                </button>

            </form>

        </div>

    </div>

</section>

{% endblock %}
