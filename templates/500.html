{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}

<div class="error-page">

    <div class="error-container">

        <h1>500</h1>

        <h2>Something Went Wrong</h2>

        <p>
            Something went wrong on our server.
            Please try again later.
        </p>

        <a
            href="{% url 'home' %}"
            class="primary-button"
        >
            Go Home
        </a>

    </div>

</div>

{% endblock %}
